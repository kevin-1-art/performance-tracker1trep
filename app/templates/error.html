{% extends "base.html" %}
{% block title %}{{ code }} {{ name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ code }} · {{ name }}</h1>
  {% if message %}<p>{{ message }}</p>{% endif %}
  <p><a href="{{ url_for('main.home') }}">Back to your dashboard</a></p>
</div>
{% endblock %}
