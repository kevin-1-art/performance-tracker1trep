{% extends "base.html" %}
{% block title %}{{ 'Edit user' if u else 'New user' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit ' ~ u.username if u else 'New user' }}</h1>
<form method="post" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Full name <input name="full_name" value="{{ request.form.get('full_name', u.full_name if u else '') }}" required></label>
  <label>Username <input name="username" value="{{ request.form.get('username', u.username if u else '') }}" required></label>
  <label>Role
    <select name="role">
      {% for r in ['user', 'manager', 'admin'] %}
        <option value="{{ r }}" {{ 'selected' if (request.form.get('role') or (u.role if u else 'user')) == r }}>{{ r }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Manager (for role "user")
    <select name="manager_id">
      <option value="">— none —</option>
      {% for m in managers %}
        <option value="{{ m.id }}" {{ 'selected' if u and u.manager_id == m.id }}>{{ m.full_name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Weekly target ({{ currency }}) <input name="weekly_target" inputmode="decimal"
         value="{{ request.form.get('weekly_target', ((u.weekly_target_minor / 100) | round(2)) if u else '0') }}"></label>
  <label>Station <input name="station" value="{{ request.form.get('station', u.station if u else '') }}"></label>
  <label>{{ 'New password (leave blank to keep)' if u else 'Password (min ' ~ min_password_length ~ ' characters)' }}
    <input type="password" name="password" minlength="{{ min_password_length }}" autocomplete="new-password" {{ '' if u else 'required' }}></label>
  <label class="check"><input type="checkbox" name="is_active" value="1" {{ 'checked' if (not u) or u.is_active }}> Active</label>
  <button class="btn" type="submit">Save</button>
  <a href="{{ url_for('admin.users') }}">Cancel</a>
</form>
{% endblock %}
