services:
  - type: web
    name: performance-tracker1trep
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run bootstrap-admin && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_FULL_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
