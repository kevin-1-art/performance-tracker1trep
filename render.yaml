services:
  - type: web
    name: performance-tracker1trep
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /login
    disk:
      name: performance-tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE
        value: /var/data/tracker.db
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
